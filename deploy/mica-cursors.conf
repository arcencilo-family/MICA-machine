# ─────────────────────────────────────────────────────────────────────────────
# MICA · S110 F-1 — pre-seed the two ABSENT-capable cursor files, correctly,
# BEFORE either hardened unit's ReadWritePaths= ever has to name them.
#
#   Install path: /etc/tmpfiles.d/mica-cursors.conf
#   Apply once, by hand or at boot: sudo systemd-tmpfiles --create mica-cursors.conf
#
# ── THE CONTRADICTION THIS FILE EXISTS TO CLOSE (F-1, observed twice live,
#    2026-09-04) ──────────────────────────────────────────────────────────────
#
#   `ReadWritePaths=<file>` in a hardened unit REFUSES TO START if that file
#   does not already exist (systemd's own namespacing: it cannot bind-mount a
#   path that is not there). But BOTH cursors this deployment uses —
#   `mica-clerk-caller.ts`'s and `registrard.ts`'s journal — are DESIGNED
#   around an ABSENT file meaning "first run, start fresh"
#   (`mica-clerk-caller.ts`'s `readCursor`, `registrard.ts`'s
#   `readJournalCursor`). ABSENT is therefore UNREACHABLE in deployment for
#   either cursor: the unit that would encounter it never starts at all.
#
# ── WHY NOT AN EMPTY FILE (the trap this file also closes) ───────────────────
#
#   `install /dev/null <path>` (S109's own original guidance) satisfies
#   ReadWritePaths — the file exists — but a 0-byte file is NOT the same fact
#   as an absent one to either cursor reader: `JSON.parse("")` throws, so a
#   0-byte cursor reads CORRUPT, not ABSENT (confirmed live tonight: house
#   pre-seeded a bare `0\n`, a plausible-looking guess that is ALSO not valid
#   JSON for either reader's schema, and the journal correctly refused it as
#   `JOURNAL_CURSOR_CORRUPT` — loud, non-blocking, exactly as designed. The
#   failure path worked; the pre-seed guess was wrong twice before it was
#   right).
#
#   So this file writes the CORRECT STARTING CONTENT, not an empty placeholder
#   — the schema each reader actually wants for "nothing carried yet," stated
#   once, declaratively, versioned, instead of re-guessed by hand at 22:30 on
#   some future deployment night.
#
# ── FIELD FORMAT (systemd-tmpfiles.d(5)) ──────────────────────────────────────
#
#   Type Path Mode UID GID Age Argument
#   `f`  = create the file WITH THIS CONTENT if and only if it does not exist
#          yet. An existing file (a real cursor with real progress) is left
#          completely alone — this line never overwrites one.
#
#   [TG] — drafted from tmpfiles.d(5)'s documented Argument-as-literal-content
#   behaviour for type `f`. NOT verified live from this seat (no root, and
#   touching /etc is out of this brief's scope regardless). VERIFY BEFORE
#   TRUSTING IN PRODUCTION:
#     sudo systemd-tmpfiles --create --dry-run /etc/tmpfiles.d/mica-cursors.conf
#   and read what it says it would do before removing the dry-run flag.
#
# Two rows, two principals, matching each program's own cursor semantics
# exactly (mica-clerk-caller.ts: ABSENT means lastStamped -1, everything in
# scope; registrard.ts: ABSENT means nextSequenceNumber 0). Mode 0600 on
# both: nobody but the writing principal itself ever reads its own cursor —
# tighter than the journal/stamps files these cursors sit beside, which DO
# need a reader group.

f /var/lib/mica/clerk-caller-cursor.json 0600 mica mica - {"lastStamped":-1}
f /var/lib/mica/mica-log-cursor.json 0600 mica-registrar mica-registrar - {"nextSequenceNumber":0}

# ── S111 — the doctor's OWN deposit-journal cursor, same trap, same fix ──────
#
#   `deposit-cli.ts`'s `journalDepositAct` (S111) reads its cursor with the
#   SAME `readJournalCursor` registrard.ts uses (reused verbatim, not
#   reimplemented) and the SAME "ABSENT means nextSequenceNumber 0" contract.
#   deposit-cli.ts has no unit of its own — it is hand-run under the doctor's
#   principal (per this build's brief, house belief, [TG] until confirmed
#   live) — but the file it writes to is still a real path a future
#   `ReadWritePaths=` or a bare invocation under `sudo -u mica-doctor` will
#   expect to already exist with correct content, never a 0-byte guess (the
#   F-1 lesson: `JSON.parse("")` throws, so an empty file reads CORRUPT, not
#   ABSENT). Pre-seeded here for the same reason, before it is ever needed.
f /var/lib/mica/mica-doctor-deposit-cursor.json 0600 mica-doctor mica-doctor - {"nextSequenceNumber":0}

# ── S111, generalized night of the same session ──────────────────────────────
#
#   deposit-cli.ts's principal-gate is SUPERSEDED (the arbiter, S111 night:
#   "generalize"): any rostered principal may now journal its own deposits,
#   under its own `--mica-log-cursor`. This file pre-seeds each principal
#   The arbiter has NAMED for the launch set so far ("Doc and arbiter now", S111
#   night, second ruling) — not every rostered principal, only the ones
#   actually declared to journal. EACH FUTURE NARRATOR NEEDS ITS OWN ROW
#   HERE, at its own cursor path, before its first journaled deposit: the
#   F-1 trap (an absent cursor is fine, a 0-byte one reads CORRUPT) applies
#   identically to every principal, not just these two. Adding a row is the
#   arbiter's own act, same as naming the principal in
#   `declared-journals.json` (`mica-report.service`'s own S111 note) — never
#   guessed or pre-populated here ahead of that naming.

f /var/lib/mica/mica-arbiter-deposit-cursor.json 0600 mica-arbiter mica-arbiter - {"nextSequenceNumber":0}
